<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Farm - Seabuckthorn Juice 500ml</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#16231D; --muted:#586761; --line:#DEE5E1; --tint:#FFF0DD;
  --brand:#D96500; --brand-hi:#E8710A; --on-brand:#FFFFFF; --leaf:#12352B; --leaf-2:#1C4A3B; --on-leaf:#FFFFFF; --soft:#CFE3D8;
  --ok:#1B7A4A; --bad:#B42318; --shadow:0 1px 2px rgba(18,53,43,.08),0 4px 14px rgba(18,53,43,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0D1813;--card:#15241D;--ink:#EDF3F0;--muted:#A2B0A9;--line:#284037;--tint:#2B2216;--brand:#F28C2E;--on-brand:#1A1206;--leaf:#0A2019;--leaf-2:#153A2D;--shadow:none}
}
:root[data-theme="dark"]{--bg:#0D1813;--card:#15241D;--ink:#EDF3F0;--muted:#A2B0A9;--line:#284037;--tint:#2B2216;--brand:#F28C2E;--on-brand:#1A1206;--leaf:#0A2019;--leaf-2:#153A2D;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Hind",system-ui,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--leaf);color:var(--on-leaf)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.tl{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;background:var(--brand);color:var(--on-brand);font-weight:600;cursor:pointer}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.logo:focus-visible{outline:3px solid #F8B36B;outline-offset:2px}
.btn.ghost{background:transparent;border-color:currentColor}
.btn.light{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.hero{background:var(--leaf);color:var(--on-leaf);padding:28px 0 36px}
.hero .wrap{display:grid;gap:20px;grid-template-columns:1fr;align-items:center}
.hero h1{font-size:clamp(2rem,7vw,3.4rem);font-weight:800}
.hero p.lead{color:var(--soft);font-size:1.1rem;margin:12px 0 18px;max-width:34ch}
.bottle{width:min(190px,48vw);justify-self:center;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}
.price-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{background:var(--leaf-2);color:var(--on-leaf);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.95rem}
@media(min-width:720px){.hero .wrap{grid-template-columns:1.3fr 1fr}.hero{padding:56px 0}}
section.blk{padding:28px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.tint{background:var(--tint);border-color:transparent}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;font-weight:800}
.stat span{color:var(--muted);font-size:.92rem}
.big-o{color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--muted)}.sm{font-size:.9rem}
.mt{margin-top:16px}.mt2{margin-top:24px}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer;min-height:46px}
.seg input{width:auto;min-height:0}
.auth{max-width:440px;margin:24px auto}
.note{background:var(--tint);border-radius:12px;padding:10px 12px;font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--tint);color:var(--brand)}
.badge.g{background:#DDF3E6;color:#14603A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.g{background:#173A2B;color:#7FDDA9}}
:root[data-theme="dark"] .badge.g{background:#173A2B;color:#7FDDA9}
.page{padding:18px 0 96px}
.page h2{margin-bottom:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:flex}
.tab{flex:1;background:none;border:0;padding:8px 2px 6px;display:grid;justify-items:center;gap:2px;font-size:.75rem;color:var(--muted);cursor:pointer;min-height:56px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.tree{min-width:max-content;display:flex;justify-content:center;padding:6px 4px}
.tn{display:flex;flex-direction:column;align-items:center}
.tk{display:flex;gap:10px;margin-top:14px;position:relative}
.tk>div{position:relative;padding-top:12px}
.tk>div::before{content:"";position:absolute;top:0;left:50%;height:12px;border-left:1.5px solid var(--line)}
.tk::before{content:"";position:absolute;top:0;left:25%;right:25%;border-top:1.5px solid var(--line)}
.tb{min-width:74px;padding:6px 8px;border-radius:12px;border:1.5px solid var(--brand);background:var(--tint);text-align:center;font-size:.8rem;line-height:1.25;cursor:pointer;color:var(--ink)}
.tb.me{background:var(--brand);color:var(--on-brand)}
.tb.em{border:1.5px dashed var(--line);background:transparent;color:var(--muted);cursor:default}
.tb b{display:block;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--leaf);color:var(--on-leaf);padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.foot{padding:22px 0 30px;color:var(--muted);font-size:.85rem}
.at{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.at button{white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
"use strict";
const KEY = "lf_db_v1", SKEY = "lf_session_v1";
const DEF = { price:1100, delivery:99, bv:700, retail:100, pair:150, cap:12, levels:[30,20,15,10,10,5], royaltyPer:30, rewardPer:50, adminPct:10, tdsPct:5, minWd:500, siteUrl:"https://liquid-farm-seabuckthorn.netlify.app/" };
const REWARDS = [{p:25,n:"Watch"},{p:75,n:"Mobile ₹15k"},{p:200,n:"Bike Fund ₹75k"},{p:500,n:"Car Fund ₹3 Lakh"}];
const RANKS = [{n:"Gold",p:250,share:.375},{n:"Silver",p:75,share:.375},{n:"Star",p:10,share:.25}];
let db, mem = {};
const st = { view:"home", tab:"dash", atab:"ov", treeRoot:null, qty:1, sess:null, confirm:"", pre:null };

/* ---------- storage (server) ---------- */
const TK="lf_token";
async function api(a,p){
  try{
    const hd={"Content-Type":"application/json"}, t=localStorage.getItem(TK); if(t) hd.Authorization="Bearer "+t;
    const r=await fetch("/api/act",{method:"POST",headers:hd,body:JSON.stringify({a,p})}), j=await r.json();
    if(j.err) return j;
    if(j.token) localStorage.setItem(TK,j.token);
    db=j.db; st.sess=j.sess||null; if(!j.sess) localStorage.removeItem(TK);
    return j;
  }catch(e){ return {err:"Network me dikkat hai, dobara koshish karein."}; }
}
function load(){
  db={settings:DEF,members:{},orders:[],payouts:[],funds:{royalty:0,reward:0},runs:[],adminFee:0,tds:0,seq:0,ord:0};
  try{
    const p=new URLSearchParams(location.search||String(location.hash||"").replace(/^#/,""));
    const ref=(p.get("ref")||"").toUpperCase();
    if(ref){ st.pre={ref, leg:p.get("leg")==="right"?"right":"left"}; st.view="signup"; }
  }catch(e){}
}
function newMember(o){ return Object.assign({left:null,right:null,lBV:0,rBV:0,lTot:0,rTot:0,pairs:0,wallet:0,earned:0,ledger:[],given:{},joined:Date.now(),addr:"",pin:""}, o); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const dt = t => new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const S = () => db.settings;
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2800); }
function rankOf(m){ const r = RANKS.find(x=>m.pairs>=x.p); return r ? r.n : ""; }
function credit(m, amt, type, note){
  if(!m || m.company || amt<=0) return;
  amt = Math.round(amt*100)/100; m.wallet += amt; m.earned += amt;
  m.ledger.unshift({t:Date.now(), type, amt, note}); if(m.ledger.length>80) m.ledger.length=80;
}

function refLink(id, leg){
  const base = (S().siteUrl||"").trim() || DEF.siteUrl;
  return base ? base+"?ref="+id+"&leg="+leg : "";
}
function shareText(id, leg){
  const l=refLink(id,leg);
  return "Liquid Farm Seabuckthorn Juice 500ml: mere "+(leg==="left"?"Left":"Right")+" team me distributor banein. "+(l?l:"Signup ke time Sponsor ID "+id+" daalein.");
}

/* ---------- views ---------- */
const IC = {
  dash:"M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
  shop:"M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0",
  team:"M12 3v6M12 9H6v5M12 9h6v5M4 14h4v5H4zM16 14h4v5h-4z",
  wallet:"M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 13h3",
  plan:"M4 10h16v10H4zM2 7h20v3H2zM12 7v13M12 7c-3 0-5-1-5-3s3-2 5 3c2-5 5-5 5-3s-2 3-5 3"
};
const berry = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="9" cy="16" r="6" fill="#F28C2E"/><circle cx="17" cy="16" r="6" fill="#E8710A"/><circle cx="13" cy="9" r="6" fill="#FFA94D"/><path d="M13 3c2-2 5-2 7-1-1 3-4 4-7 1z" fill="#7BC98F"/></svg>';
const bottle = '<svg class="bottle" viewBox="0 0 200 320" role="img" aria-label="Seabuckthorn juice bottle"><rect x="76" y="6" width="48" height="32" rx="7" fill="#0A1F18"/><path d="M82 38h36v36c0 14 42 22 42 56v150a20 20 0 0 1-20 20H60a20 20 0 0 1-20-20V130c0-34 42-42 42-56z" fill="#F28C2E"/><path d="M48 150c30-10 74 10 104 0v140a12 12 0 0 1-12 12H60a12 12 0 0 1-12-12z" fill="#E8710A" opacity=".55"/><rect x="54" y="168" width="92" height="112" rx="10" fill="#fff"/><circle cx="84" cy="196" r="9" fill="#F28C2E"/><circle cx="100" cy="196" r="9" fill="#E8710A"/><circle cx="116" cy="196" r="9" fill="#FFA94D"/><text x="100" y="230" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="14" fill="#12352B">Seabuckthorn</text><text x="100" y="248" text-anchor="middle" font-family="Hind,sans-serif" font-size="11" fill="#586761">Liquid Farm</text><text x="100" y="268" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="16" fill="#D96500">500 ml</text></svg>';

function topbar(){
  const u = st.sess && st.sess!=="ADMIN" ? db.members[st.sess] : null;
  const right = st.sess==="ADMIN" ? '<span class="chip">Admin</span><button class="btn ghost sm" data-act="logout">Logout</button>'
    : u ? '<span class="chip">'+esc(u.id)+'</span><button class="btn ghost sm" data-act="logout">Logout</button>'
    : '<button class="btn ghost sm" data-act="go" data-to="login">Login</button><button class="btn sm" data-act="go" data-to="signup">Signup</button>';
  return '<header class="top"><div class="wrap"><button class="logo" data-act="home">'+berry+'Liquid Farm</button><div class="tl">'+right+'</div></div></header>';
}
function planRows(){
  const s=S();
  return '<div class="scroll"><table><tbody>'+
    '<tr><td>Retail profit</td><td><b>'+money(s.retail)+'</b> har bottle par</td></tr>'+
    '<tr><td>Binary income</td><td><b>'+money(s.pair)+'</b> per pair ('+s.bv+' BV : '+s.bv+' BV), roz '+s.cap+' pair tak = '+money(s.cap*s.pair)+'</td></tr>'+
    '<tr><td>Level income</td><td>'+s.levels.map(x=>money(x)).join(" / ")+' (6 level, khud ka 1 pair zaruri)</td></tr>'+
    '<tr><td>Royalty fund</td><td>Star 10 pair 1%, Silver 75 pair 1.5%, Gold 250 pair 1.5%</td></tr>'+
    '<tr><td>Reward fund</td><td>25 pair Watch, 75 Mobile, 200 Bike Fund, 500 Car Fund</td></tr>'+
    '</tbody></table></div>';
}
function disclaimer(){ return '<p class="foot">Income aapki team ki sales par nirbhar hai aur guaranteed nahi hai. Payout par '+S().adminPct+'% admin charge aur '+S().tdsPct+'% TDS katega. Ye ek demo version hai, data sirf is browser me save hota hai.</p>'; }

function vHome(){
  const s=S();
  return topbar()+
  '<section class="hero"><div class="wrap"><div><h1>Seabuckthorn Juice, seedha Liquid Farm se</h1><p class="lead">500ml ki bottle, ghar tak delivery. Bechne wale sabhi members ko turant profit.</p>'+
  '<div class="price-row"><span class="chip">MRP '+money(s.price)+'</span><span class="chip">+ '+money(s.delivery)+' delivery</span><span class="chip">'+s.bv+' BV</span></div>'+
  '<div class="tl" style="flex-wrap:wrap">'+(st.sess&&st.sess!=="ADMIN"?'<button class="btn" data-act="gotab" data-to="shop">Abhi order karein</button><button class="btn ghost" data-act="gotab" data-to="dash">Mera Dashboard</button>':'<button class="btn" data-act="go" data-to="signup">Distributor Signup</button><button class="btn ghost" data-act="go" data-to="login">Distributor Login</button>')+'</div></div>'+bottle+'</div></section>'+
  '<section class="blk"><div class="wrap"><h2>Kaise kaam karta hai</h2><div class="grid g3 mt">'+
  '<div class="card"><h3>1. Join karein</h3><p class="muted mt">Sponsor ID daalein aur Left ya Right team chunein.</p></div>'+
  '<div class="card"><h3>2. Bottle mangwayein</h3><p class="muted mt">Har bottle par '+s.bv+' BV aapki upar ki team me judta hai.</p></div>'+
  '<div class="card"><h3>3. Wallet me income</h3><p class="muted mt">Retail, binary, level, royalty aur reward, sab ek wallet me dikhta hai.</p></div></div></div></section>'+
  '<section class="blk"><div class="wrap"><h2>Income plan</h2><div class="card mt">'+planRows()+'</div></div></section>'+
  '<div class="wrap">'+disclaimer()+'</div>';
}
function vLogin(){
  return topbar()+'<div class="wrap"><div class="auth card"><h2>Distributor Login</h2><form data-form="login" class="mt"><label>Member ID<input name="id" placeholder="LF1001" autocapitalize="characters" autocomplete="username" required></label><label>Password<input name="pass" type="password" autocomplete="current-password" required></label><button class="btn">Login</button></form>'+
  '<p class="muted sm mt">Naye hain? <a href="#" data-act="go" data-to="signup"><b>Yahan join karein</b></a></p></div></div>';
}
function preNote(){
  if(!st.pre) return "";
  const m=db.members[st.pre.ref]; if(!m) return "";
  return '<p class="note mt">Aapko <b>'+esc(m.name)+'</b> ('+m.id+') ne '+(st.pre.leg==="right"?"Right":"Left")+' team me bulaya hai.</p>';
}
function vSignup(){
  return topbar()+'<div class="wrap"><div class="auth card"><h2>Distributor Signup</h2>'+(preNote())+'<form data-form="signup" class="mt">'+
  '<label>Poora naam<input name="name" autocomplete="name" required></label>'+
  '<label>Mobile number<input name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel" required></label>'+
  '<label>Password<input name="pass" type="password" autocomplete="new-password" required></label>'+
  '<label>Sponsor ID<input name="sponsor" value="'+esc(st.pre?st.pre.ref:"LF1000")+'" autocapitalize="characters" required></label>'+
  '<div><span class="sm"><b>Aap sponsor ki kis team me judna chahte hain?</b></span><div class="seg mt"><label><input type="radio" name="leg" value="left" '+(st.pre&&st.pre.leg==="right"?"":"checked")+'> Left</label><label><input type="radio" name="leg" value="right" '+(st.pre&&st.pre.leg==="right"?"checked":"")+'> Right</label></div></div>'+
  '<button class="btn">Join karein</button></form><p class="muted sm mt">Pehle se member? <a href="#" data-act="go" data-to="login"><b>Login</b></a></p></div></div>';
}

/* member area */
function me(){ return db.members[st.sess]; }
function nav(tabs, cur, act){
  return '<nav class="nav" aria-label="Menu"><div class="wrap">'+tabs.map(t=>'<button class="tab" data-act="'+act+'" data-to="'+t[0]+'" '+(cur===t[0]?'aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+IC[t[2]]+'"/></svg>'+t[1]+'</button>').join("")+'</div></nav>';
}
function vApp(){
  const m=me(); let body="";
  if(st.tab==="dash") body=tDash(m); else if(st.tab==="shop") body=tShop(m); else if(st.tab==="team") body=tTeam(m); else if(st.tab==="wallet") body=tWallet(m); else body=tPlan(m);
  return topbar()+'<main class="wrap page">'+body+'</main>'+nav([["dash","Home","dash"],["shop","Order","shop"],["team","Team","team"],["wallet","Wallet","wallet"],["plan","Plan","plan"]], st.tab, "gotab");
}
function tDash(m){
  const s=S(), pr=Math.min(1,Math.min(m.lBV,m.rBV)/s.bv), next=REWARDS.find(r=>m.pairs<r.p), rk=rankOf(m);
  const led=m.ledger.slice(0,5).map(l=>'<div class="row"><div><b>'+esc(l.type)+'</b><div class="muted sm">'+esc(l.note)+' · '+dt(l.t)+'</div></div><span class="'+(l.amt>=0?"pos":"neg")+'">'+(l.amt>=0?"+":"")+money(l.amt)+'</span></div>').join("") || '<p class="muted">Abhi koi income nahi aayi. Pehli bottle ka order karein ya team banayein.</p>';
  return '<h2>Namaste, '+esc(m.name.split(" ")[0])+'</h2>'+
  '<div class="grid g3"><div class="card tint stat"><b class="big-o">'+money(m.wallet)+'</b><span>Wallet balance</span><div class="mt"><button class="btn sm" data-act="gotab" data-to="wallet">Paisa nikaalein</button></div></div><div class="card stat"><b>'+money(m.earned)+'</b><span>Kul income</span></div><div class="card stat"><b>'+(rk||"Rank nahi")+'</b><span>'+m.pairs+' pair complete</span></div></div>'+
  '<div class="card mt"><h3>Team BV</h3><div class="grid g2 mt"><div class="stat"><b>'+m.lBV+'</b><span>Left (agle pair ke liye)</span></div><div class="stat"><b>'+m.rBV+'</b><span>Right (agle pair ke liye)</span></div></div>'+
  '<div class="mt"><div class="bar" role="progressbar" aria-valuenow="'+Math.round(pr*100)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+(pr*100)+'%"></i></div><p class="muted sm mt">Agla pair banne me: dono side '+s.bv+' BV chahiye. Pair ki income roz raat ko wallet me judti hai.</p></div></div>'+
  (next?'<div class="card mt"><h3>Agla reward: '+next.n+'</h3><div class="bar mt"><i style="width:'+Math.min(100,m.pairs/next.p*100)+'%"></i></div><p class="muted sm mt">'+m.pairs+' / '+next.p+' pair</p></div>':'')+
  refBox(m)+
  '<div class="card mt"><h3>Haal ki income</h3><div class="mt">'+led+'</div></div>'+disclaimer();
}
function refBox(m){
  const rows=["left","right"].map(l=>{
    const link=refLink(m.id,l), txt=link||("Sponsor ID "+m.id+" · "+(l==="left"?"Left":"Right")+" team"), t=shareText(m.id,l);
    return '<div class="mt"><b>'+(l==="left"?"Left":"Right")+' team referral link</b><input class="mt" readonly value="'+esc(txt)+'" aria-label="'+l+' referral link"><div class="tl mt"><button class="btn sm" data-act="copy" data-v="'+esc(t)+'">Copy</button><a class="btn sm light" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(t)+'">WhatsApp par bhejein</a></div></div>';
  }).join("");
  return '<div class="card mt"><h3>Meri Referral Link</h3><p class="muted sm mt">Ye link kholkar naya member seedha Signup page par aayega aur aapki ID pehle se bhari hogi.</p>'+rows+(refLink(m.id,"left")?'':'<p class="note mt">Website ka address abhi set nahi hai. Admin Settings me "Website address" daalte hi poori link ban jayegi.</p>')+'</div>';
}
function tShop(m){
  const s=S(), q=st.qty, tot=s.price*q+s.delivery;
  const mine=db.orders.filter(o=>o.member===m.id).slice(0,6).map(o=>'<div class="row"><div><b>'+o.id+'</b> · '+o.qty+' bottle<div class="muted sm">'+dt(o.date)+' · '+money(o.amount)+'</div></div><span class="badge '+(o.status==="Delivered"?"g":"")+'">'+o.status+'</span></div>').join("");
  return '<h2>Seabuckthorn 500ml</h2><div class="card"><div class="tl" style="align-items:flex-start"><div style="width:74px;flex:none">'+bottle.replace('class="bottle"','style="width:74px"')+'</div><div><h3>Liquid Farm Juice</h3><p class="muted sm mt">MRP '+money(s.price)+' + '+money(s.delivery)+' delivery · '+s.bv+' BV har bottle</p></div></div>'+
  '<form data-form="order" class="mt"><label>Kitni bottle<input name="qty" type="number" min="1" max="20" value="'+q+'" inputmode="numeric" required></label>'+
  '<label>Naam<input name="name" value="'+esc(m.name)+'" required></label><label>Mobile<input name="mobile" value="'+esc(m.mobile)+'" inputmode="numeric" maxlength="10" required></label>'+
  '<label>Poora pata<textarea name="addr" rows="2" required>'+esc(m.addr)+'</textarea></label><label>Pincode<input name="pin" value="'+esc(m.pin)+'" inputmode="numeric" maxlength="6" required></label>'+
  '<div class="note" id="sum">Total: <b>'+money(tot)+'</b> ('+q+' x '+money(s.price)+' + '+money(s.delivery)+' delivery) · '+(s.bv*q)+' BV</div>'+
  '<button class="btn">Order karein</button><p class="muted sm">Demo me payment "ho gaya" maana jayega. Asli site par Razorpay/UPI judega.</p></form></div>'+
  (mine?'<div class="card mt"><h3>Mere orders</h3><div class="mt">'+mine+'</div></div>':'');
}
function tnode(id, depth, isRoot){
  const m=id&&db.members[id];
  if(!m) return '<div class="tb em">Khali</div>';
  const box='<button class="tb '+(isRoot?"me":"")+'" data-act="troot" data-id="'+m.id+'"><b>'+esc(m.name.split(" ")[0])+'</b>'+m.id+'</button>';
  if(depth===0) return '<div class="tn">'+box+'</div>';
  if(!m.left && !m.right) return '<div class="tn">'+box+'</div>';
  return '<div class="tn">'+box+'<div class="tk"><div>'+tnode(m.left,depth-1)+'</div><div>'+tnode(m.right,depth-1)+'</div></div></div>';
}
function inDownline(root, id){ let c=db.members[id]; while(c){ if(c.id===root) return true; c=c.parent&&db.members[c.parent]; } return false; }
function tTeam(m){
  let root = st.treeRoot && db.members[st.treeRoot] && inDownline(m.id, st.treeRoot) ? st.treeRoot : m.id;
  const rm=db.members[root];
  const directs=Object.values(db.members).filter(x=>x.sponsor===m.id);
  return '<h2>Meri Team</h2><div class="card"><div class="row" style="border:0"><div><b>'+esc(rm.name)+'</b><div class="muted sm">'+rm.id+' · Left '+rm.lTot+' BV · Right '+rm.rTot+' BV (kul)</div></div>'+(root!==m.id?'<button class="btn sm light" data-act="troot" data-id="'+m.id+'">Meri tree</button>':'')+'</div>'+
  '<div class="scroll mt"><div class="tree">'+tnode(root,3,true)+'</div></div><p class="muted sm mt">Kisi member par tap karke uski tree dekhein. Left/Right chhota member pehle se bhar jaye to naya member neeche wale khali slot me jaata hai.</p></div>'+
  '<div class="card mt"><h3>Mere direct sponsor kiye member ('+directs.length+')</h3><div class="mt">'+(directs.map(d=>'<div class="row"><div><b>'+esc(d.name)+'</b><div class="muted sm">'+d.id+' · '+d.leg+'</div></div><span class="badge">'+(rankOf(d)||"New")+'</span></div>').join("")||'<p class="muted">Abhi koi nahi. Apni Sponsor ID share karein.</p>')+'</div></div>';
}
function tWallet(m){
  const s=S();
  const led=m.ledger.map(l=>'<tr><td>'+dt(l.t)+'</td><td>'+esc(l.type)+'</td><td>'+esc(l.note)+'</td><td class="'+(l.amt>=0?"pos":"neg")+'">'+(l.amt>=0?"+":"")+money(l.amt)+'</td></tr>').join("");
  const po=db.payouts.filter(p=>p.member===m.id).map(p=>'<tr><td>'+p.id+'</td><td>'+money(p.amt)+'</td><td>'+money(p.net)+'</td><td><span class="badge '+(p.status==="Paid"?"g":"")+'">'+p.status+'</span></td></tr>').join("");
  return '<h2>Wallet</h2><div class="card tint stat"><b class="big-o">'+money(m.wallet)+'</b><span>Nikaalne layak balance</span></div>'+
  '<div class="card mt"><h3>Withdrawal request</h3><form data-form="wd" class="mt"><label>Rakam (minimum '+money(s.minWd)+')<input name="amt" type="number" min="'+s.minWd+'" inputmode="numeric" required></label><div class="note" id="wsum">'+s.adminPct+'% admin charge aur '+s.tdsPct+'% TDS katkar baaki bank me aayega.</div>'+(m.wallet<s.minWd?'<p class="muted sm">Withdrawal ke liye wallet me kam se kam '+money(s.minWd)+' hone chahiye. Abhi balance '+money(m.wallet)+' hai.</p>':'')+'<button class="btn" '+(m.wallet<s.minWd?"disabled style=\'opacity:.5\'":"")+'>Request bhejein</button></form></div>'+
  (po?'<div class="card mt"><h3>Payout requests</h3><div class="scroll mt"><table><thead><tr><th>ID</th><th>Rakam</th><th>Net</th><th>Status</th></tr></thead><tbody>'+po+'</tbody></table></div></div>':'')+
  '<div class="card mt"><h3>Income history</h3><div class="scroll mt">'+(led?'<table><thead><tr><th>Tarikh</th><th>Type</th><th>Detail</th><th>Rakam</th></tr></thead><tbody>'+led+'</tbody></table>':'<p class="muted">Abhi koi entry nahi.</p>')+'</div></div>';
}
function tPlan(m){
  const rw=REWARDS.map(r=>{ const got=m.pairs>=r.p; return '<div class="row"><div><b>'+r.n+'</b><div class="muted sm">'+r.p+' pair'+(m.given[r.p]?" · mil chuka":"")+'</div></div>'+(got?'<span class="badge g">Poora</span>':'<span class="muted sm">'+m.pairs+'/'+r.p+'</span>')+'</div>'; }).join("");
  return '<h2>Income Plan</h2><div class="card">'+planRows()+'</div><div class="card mt"><h3>Mere reward</h3><div class="mt">'+rw+'</div></div>'+disclaimer();
}

/* admin */
function vAdmin(){
  const t=st.atab, tabs=[["ov","Overview"],["mem","Members"],["ord","Orders"],["pay","Payouts"],["set","Settings"]];
  const bar='<div class="at">'+tabs.map(x=>'<button class="btn sm '+(t===x[0]?"":"light")+'" data-act="atab" data-to="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>';
  let b="";
  const ms=Object.values(db.members).filter(m=>!m.company);
  if(t==="ov"){
    const sales=db.orders.reduce((a,o)=>a+o.amount,0), pend=db.payouts.filter(p=>p.status==="Pending").length, last=db.runs[0];
    b='<div class="grid g3"><div class="card stat"><b>'+ms.length+'</b><span>Members</span></div><div class="card stat"><b>'+db.orders.length+'</b><span>Orders</span></div><div class="card stat"><b>'+money(sales)+'</b><span>Kul sales</span></div><div class="card stat"><b>'+money(db.funds.royalty)+'</b><span>Royalty fund</span></div><div class="card stat"><b>'+money(db.funds.reward)+'</b><span>Reward fund</span></div><div class="card stat"><b>'+pend+'</b><span>Pending payout</span></div></div>'+
    '<div class="card mt"><h3>Daily income run</h3><p class="muted mt">Asli site par ye roz raat 12 baje apne aap chalega. Demo me button se chalayein: pair match hoga, cap lagega, bacha BV carry forward hoga aur royalty banthegi.</p><div class="tl mt"><button class="btn" data-act="run">Daily income chalayein</button></div>'+(last?'<p class="note mt">Pichla run: '+last.pairs+' pair, binary '+money(last.binary)+', royalty '+money(last.royalty)+'</p>':'')+'</div>'+
    '<div class="card mt"><h3>Demo data</h3><p class="muted mt">14 sample members aur unke orders daalta hai (password 1234) taaki tree aur income dikh sake.</p><div class="tl mt"><button class="btn light" data-act="seed">Sample members jodein</button><button class="btn bad" data-act="reset">'+(st.confirm==="reset"?"Pakka? Dobara dabayein":"Sab data hatayein")+'</button></div></div>';
  } else if(t==="mem"){
    b='<div class="card"><div class="scroll"><table><thead><tr><th>ID</th><th>Naam</th><th>Sponsor</th><th>Leg</th><th>L BV</th><th>R BV</th><th>Pair</th><th>Rank</th><th>Wallet</th></tr></thead><tbody>'+ms.map(m=>'<tr><td>'+m.id+'</td><td>'+esc(m.name)+'</td><td>'+m.sponsor+'</td><td>'+m.leg+'</td><td>'+m.lBV+'</td><td>'+m.rBV+'</td><td>'+m.pairs+'</td><td>'+(rankOf(m)||"-")+'</td><td>'+money(m.wallet)+'</td></tr>').join("")+'</tbody></table></div>'+(ms.length?"":'<p class="muted">Abhi koi member nahi.</p>')+'</div>';
  } else if(t==="ord"){
    const next={Placed:"Shipped",Shipped:"Delivered"};
    b='<div class="card"><div class="scroll"><table><thead><tr><th>Order</th><th>Member</th><th>Bottle</th><th>Rakam</th><th>Pata</th><th>Status</th></tr></thead><tbody>'+db.orders.map(o=>'<tr><td>'+o.id+'</td><td>'+o.member+'</td><td>'+o.qty+'</td><td>'+money(o.amount)+'</td><td>'+esc(o.addr)+' '+esc(o.pin)+'</td><td>'+(next[o.status]?'<button class="btn sm light" data-act="ship" data-id="'+o.id+'">'+o.status+' → '+next[o.status]+'</button>':'<span class="badge g">Delivered</span>')+'</td></tr>').join("")+'</tbody></table></div>'+(db.orders.length?"":'<p class="muted">Abhi koi order nahi.</p>')+'</div>';
  } else if(t==="pay"){
    const claims=[]; ms.forEach(m=>REWARDS.forEach(r=>{ if(m.pairs>=r.p && !m.given[r.p]) claims.push({m,r}); }));
    b='<div class="card"><h3>Withdrawal requests</h3><div class="scroll mt"><table><thead><tr><th>ID</th><th>Member</th><th>Rakam</th><th>Admin</th><th>TDS</th><th>Net</th><th>Status</th></tr></thead><tbody>'+db.payouts.map(p=>'<tr><td>'+p.id+'</td><td>'+p.member+'</td><td>'+money(p.amt)+'</td><td>'+money(p.fee)+'</td><td>'+money(p.tds)+'</td><td>'+money(p.net)+'</td><td>'+(p.status==="Pending"?'<button class="btn sm ok" data-act="approve" data-id="'+p.id+'">Paid</button> <button class="btn sm bad" data-act="reject" data-id="'+p.id+'">Reject</button>':'<span class="badge '+(p.status==="Paid"?"g":"")+'">'+p.status+'</span>')+'</td></tr>').join("")+'</tbody></table></div>'+(db.payouts.length?"":'<p class="muted">Abhi koi request nahi.</p>')+'</div>'+
    '<div class="card mt"><h3>Reward claims</h3><div class="mt">'+(claims.map(c=>'<div class="row"><div><b>'+esc(c.m.name)+'</b> ('+c.m.id+')<div class="muted sm">'+c.r.n+' · '+c.r.p+' pair</div></div><button class="btn sm ok" data-act="give" data-id="'+c.m.id+'" data-p="'+c.r.p+'">Diya gaya</button></div>').join("")||'<p class="muted">Koi pending reward nahi.</p>')+'</div></div>'+
    '<p class="note mt">Admin charge ab tak: '+money(db.adminFee)+' · TDS ab tak: '+money(db.tds)+'</p>';
  } else {
    const s=S(), f=(k,l)=>'<label>'+l+'<input name="'+k+'" type="number" step="any" value="'+s[k]+'"></label>';
    b='<div class="card"><form data-form="settings">'+f("price","MRP / DP (₹)")+f("delivery","Delivery (₹)")+f("bv","BV per bottle")+f("retail","Retail profit (₹, sponsor ko)")+f("pair","Binary per pair (₹)")+f("cap","Daily cap (pair)")+
    '<label>Level income L1 se L6 (comma se alag)<input name="levels" value="'+s.levels.join(", ")+'"></label>'+f("royaltyPer","Royalty fund per bottle (₹)")+f("rewardPer","Reward fund per bottle (₹)")+f("adminPct","Admin charge %")+f("tdsPct","TDS %")+f("minWd","Minimum withdrawal (₹)")+'<label>Website address (referral link ke liye)<input name="siteUrl" type="url" placeholder="https://www.aapkidomain.com/" value="'+esc(s.siteUrl||"")+'"></label><button class="btn">Settings save karein</button></form></div>';
  }
  return topbar()+'<main class="wrap page"><h2>Admin Panel</h2>'+bar+b+'</main>';
}

/* ---------- render / events ---------- */
function render(){
  let h;
  if(st.sess==="ADMIN") h=vAdmin();
  else if(st.sess && db.members[st.sess]) h=vApp();
  else h = st.view==="login"?vLogin(): st.view==="signup"?vSignup(): vHome();
  $("#app").innerHTML=h;
}
function go(v){ st.view=v; render(); window.scrollTo(0,0); }
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, d=t.dataset;
  if(a!=="reset") st.confirm="";
  if(a==="go"||a==="home"){ e.preventDefault(); if(a==="home"){ if(st.sess&&st.sess!=="ADMIN"){st.tab="dash";} else if(!st.sess){st.view="home";} } else st.view=d.to; render(); window.scrollTo(0,0); }
  else if(a==="gotab"){ st.tab=d.to; if(!st.sess) st.view="login"; render(); window.scrollTo(0,0); }
  else if(a==="atab"){ st.atab=d.to; render(); }
  else if(a==="logout"){ localStorage.removeItem(TK); await api("state"); st.sess=null; st.view="home"; render(); window.scrollTo(0,0); }
  else if(a==="troot"){ st.treeRoot=d.id; render(); }
  else if(a==="copy"){
    const txt=d.v;
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Copy ho gaya"),()=>toast(txt)); }catch(err){ toast(txt); }
  }
  else if(a==="run"){ const r=await api("run"); if(r.err) return toast(r.err); render(); toast(r.run.pairsPaid+" pair ki income di gayi"); }
  else if(["ship","approve","reject","give"].includes(a)){ const r=await api(a,{id:d.id,p:d.p}); if(r.err) return toast(r.err); render(); if(a==="approve") toast("Payout paid mark ho gaya"); }
  else if(a==="seed"||a==="reset"){ toast("Live site par demo/reset band hai."); }
});
document.addEventListener("input", e=>{
  const f=e.target.form; if(!f) return;
  if(f.dataset.form==="order" && e.target.name==="qty"){
    const s=S(), q=Math.max(1,Math.min(20,parseInt(e.target.value)||1)); st.qty=q;
    $("#sum").innerHTML='Total: <b>'+money(s.price*q+s.delivery)+'</b> ('+q+' x '+money(s.price)+' + '+money(s.delivery)+' delivery) · '+(s.bv*q)+' BV';
  }
  if(f.dataset.form==="wd" && e.target.name==="amt"){
    const s=S(), a=parseFloat(e.target.value)||0, fee=a*s.adminPct/100, tds=a*s.tdsPct/100;
    $("#wsum").innerHTML=a?'Admin '+money(fee)+' + TDS '+money(tds)+' katkar <b>'+money(a-fee-tds)+'</b> aayega.':s.adminPct+'% admin charge aur '+s.tdsPct+'% TDS katkar baaki bank me aayega.';
  }
});
document.addEventListener("submit", async e=>{
  const f=e.target; if(!f.dataset.form) return; e.preventDefault();
  const v=Object.fromEntries(new FormData(f).entries()), k=f.dataset.form; let r;
  if(k==="login"){ r=await api("login",v); if(r.err) return toast(r.err); st.atab="ov"; st.tab="dash"; st.treeRoot=null; render(); window.scrollTo(0,0); }
  else if(k==="signup"){ r=await api("signup",v); if(r.err) return toast(r.err); st.pre=null; st.tab="dash"; render(); window.scrollTo(0,0); toast("Swagat hai! Aapki ID: "+r.newId); }
  else if(k==="order"){
    if(!/^\d{10}$/.test(v.mobile.trim())) return toast("Mobile number 10 digit ka hona chahiye.");
    if(!/^\d{6}$/.test(v.pin.trim())) return toast("Pincode 6 digit ka hona chahiye.");
    r=await api("order",v); if(r.err) return toast(r.err); st.qty=1; render(); toast("Order "+r.order.id+" ho gaya. "+r.order.bv+" BV judi.");
  }
  else if(k==="wd"){ r=await api("wd",{amt:v.amt}); if(r.err) return toast(r.err); render(); toast("Request bhej di gayi"); }
  else if(k==="settings"){ r=await api("settings",v); if(r.err) return toast(r.err); render(); toast("Settings save ho gayi"); }
});
load(); render(); api("state").then(()=>render());
</script>
